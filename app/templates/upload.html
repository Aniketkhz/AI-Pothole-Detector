<!DOCTYPE html>
<html>
<head>
    <title>Upload Image</title>
    <style>
        body { font-family: Arial; padding: 40px; max-width: 600px; margin: 0 auto; text-align: center; }
        h1 { color: #333; margin-bottom: 30px; }
        .upload-box { border: 2px dashed #ccc; padding: 30px; border-radius: 8px; margin: 20px 0; }
        .btn { display: inline-block; padding: 12px 25px; background: #4CAF50; color: white; 
               text-decoration: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #fileInput { display: none; }
        #fileName { margin: 10px 0; font-style: italic; }
    </style>
</head>
<body>
    <h1>Upload Image for Pothole Detection</h1>
    
    <form method="post" enctype="multipart/form-data" id="uploadForm">
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p>Click to select an image</p>
            <p id="fileName">No file selected</p>
            <input type="file" id="fileInput" name="image" accept="image/*" required>
        </div>
        <button type="submit" class="btn">Detect Potholes</button>
    </form>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : 'No file selected';
            document.getElementById('fileName').textContent = fileName;
        });
    </script>
</body>
</html>
